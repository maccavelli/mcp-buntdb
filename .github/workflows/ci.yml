name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint" make lint

  # The module's floor, go 1.26.11. GOTOOLCHAIN=local stops the toolchain
  # line switching to 1.27.4, and go-version, not go-version-file, keeps
  # setup-go from reading it
  # (docs/decisions/0001-MADR-move-toolchain-to-go-1-27-4-and-floor-to-1-26-11.md, A2).
  # The repository has no test files, so this proves only that it builds
  # and vets under the floor.
  go126:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
      - name: the floor toolchain
        run: test "$(go env GOVERSION)" = go1.26.11
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
